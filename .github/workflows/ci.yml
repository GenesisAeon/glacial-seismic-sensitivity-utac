name: CI

on:
  push:
    branches: ["main", "master", "claude/**"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Run ruff
        run: ruff check src tests scripts
      - name: Run mypy
        run: mypy src

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run pytest with coverage (offline, synthetic fixtures only)
        run: pytest --cov=src --cov-report=xml

  test-min-deps:
    name: Tests (Python 3.11, minimum dependency versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with the declared lower bounds of numpy/pandas/scipy/matplotlib
        run: |
          pip install -e ".[dev]"
          pip install "numpy==1.26.*" "pandas==2.1.*" "scipy==1.11.*" "matplotlib==3.8.*"
          python -c "import numpy, pandas, scipy, matplotlib; print(numpy.__version__, pandas.__version__, scipy.__version__, matplotlib.__version__)"
      - name: Run pytest (offline, synthetic fixtures only)
        run: pytest -q
