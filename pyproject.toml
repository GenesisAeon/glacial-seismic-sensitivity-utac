[project]
name = "glacial-seismic-sensitivity-utac"
version = "0.2.0.dev0"
description = "Does the same seasonal ice/snow unloading trigger more earthquakes over time? Pre-registered sensitivity ('early-stage') tests, distribution/dynamics indicators and a viscoelastic lag/detectability model for seismicity near shrinking glaciers vs. controls -- no UTAC/CREP/AFET bridge"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Römer, Johann" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "requests>=2.31",
    "h5py>=3.10",
]

[project.scripts]
glacial-sensitivity = "glacial_seismic_sensitivity_utac.cli:main"

[project.urls]
Homepage = "https://github.com/GenesisAeon/glacial-seismic-sensitivity-utac"
Repository = "https://github.com/GenesisAeon/glacial-seismic-sensitivity-utac"

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glacial_seismic_sensitivity_utac"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=glacial_seismic_sensitivity_utac --cov-report=term-missing -v"

[tool.hatch.build.targets.sdist]
exclude = ["data", "logs", ".venv", "results/series"]
